name = "push-demo"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# For `wrangler pages dev` a local KV is simulated automatically.
# For deploy: `wrangler kv namespace create SUBS` and put the id here.
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_ID_BEFORE_DEPLOY"
